[platformio]
default_envs = device_a, device_b
core_dir = .tools/platformio

[env]
platform = espressif32@6.12.0
board = lilygo-t-display
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/display-setup.py
lib_deps = bodmer/TFT_eSPI@2.5.43
board_build.partitions = partitions_4mb.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D USER_SETUP_LOADED
    -include User_Setups/Setup25_TTGO_T_Display.h

[env:device_a]
build_flags = ${env.build_flags} -D DEVICE_A

[env:device_b]
build_flags = ${env.build_flags} -D DEVICE_B

[env:device_a_16mb]
board_build.partitions = partitions_16mb.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags = ${env.build_flags} -D DEVICE_A

[env:device_b_16mb]
board_build.partitions = partitions_16mb.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags = ${env.build_flags} -D DEVICE_B

[env:device_a_landscape]
build_flags = ${env.build_flags} -D DEVICE_A -D MORSE_LANDSCAPE=1

[env:device_b_landscape]
build_flags = ${env.build_flags} -D DEVICE_B -D MORSE_LANDSCAPE=1

[env:device_a_16mb_landscape]
board_build.partitions = partitions_16mb.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags = ${env.build_flags} -D DEVICE_A -D MORSE_LANDSCAPE=1

[env:device_b_16mb_landscape]
board_build.partitions = partitions_16mb.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags = ${env.build_flags} -D DEVICE_B -D MORSE_LANDSCAPE=1

[env:wokwi]
build_flags = ${env.build_flags} -D DEVICE_A -D MORSE_WOKWI
build_src_filter = +<*> -<transport/> -<PairStore.cpp> -<FlashInboxStore.cpp>
