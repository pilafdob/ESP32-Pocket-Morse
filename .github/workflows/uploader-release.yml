name: Desktop uploader releases

on:
  push:
    tags:
      - 'uploader-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-packaging.txt
      - name: Build Windows GUI executable
        if: runner.os == 'Windows'
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name PocketMorseUploader --hidden-import serial.tools.list_ports
          scripts/flash_pair_gui.py
      - name: Build macOS GUI app
        if: runner.os == 'macOS'
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name PocketMorseUploader --hidden-import serial.tools.list_ports
          scripts/flash_pair_gui.py
      - name: Build pairing helper
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name provision_pair scripts/provision_pair.py
      - name: Assemble distributable archive
        run: python scripts/package_uploader.py --output build/uploader-release
      - uses: actions/upload-artifact@v7
        with:
          name: pocket-morse-uploader-${{ runner.os }}-${{ runner.arch }}
          path: build/uploader-release/*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/uploader-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#uploader-v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/*.zip --clobber
          else
            gh release create "$TAG" release-assets/*.zip \
              --title "Pocket Morse Uploader v$VERSION (Beta)" \
              --prerelease --generate-notes

          fi