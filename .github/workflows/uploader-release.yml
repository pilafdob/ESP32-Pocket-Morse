name: Desktop uploader releases

on:
  push:
    tags:
      - 'uploader-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.23
      - run: npm run build
      - run: npm test
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.19
      - run: >-
          pio run
          -e device_a -e device_b
          -e device_a_16mb -e device_b_16mb
          -e device_a_landscape -e device_b_landscape
          -e device_a_16mb_landscape -e device_b_16mb_landscape
          -e wokwi

  build:
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-packaging.txt
      - name: Build Windows GUI executable
        if: runner.os == 'Windows'
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name PocketMorseUploader --hidden-import serial.tools.list_ports
          --version-file scripts/PocketMorseUploader-version.txt
          scripts/flash_pair_gui.py
      - name: Build macOS GUI app
        if: runner.os == 'macOS'
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name PocketMorseUploader --hidden-import serial.tools.list_ports
          --osx-bundle-identifier com.github.pilafdob.pocketmorse
          scripts/flash_pair_gui.py
      - name: Set macOS app version and display metadata
        if: runner.os == 'macOS'
        run: python scripts/set_macos_bundle_metadata.py dist/PocketMorseUploader.app
      - name: Build pairing helper
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name provision_pair scripts/provision_pair.py
      - name: Assemble distributable archive
        run: python scripts/package_uploader.py
      - uses: actions/upload-artifact@v7
        with:
          name: pocket-morse-uploader-${{ runner.os }}-${{ runner.arch }}
          path: build/mac-uploader/release/*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/uploader-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#uploader-v}"
          PRERELEASE_ARGS=()
          NOTES_FILE="docs/releases/${TAG}.md"
          NOTES_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          if [[ -f "$NOTES_FILE" ]]; then
            NOTES_ARGS+=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS+=(--generate-notes)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/*.zip --clobber
          else
          gh release create "$TAG" release-assets/*.zip \
              --title "Pocket Morse Communicators v$VERSION" \
              "${NOTES_ARGS[@]}" "${PRERELEASE_ARGS[@]}"

          fi
